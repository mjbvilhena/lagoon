name: QA

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      # gitleaks-action@v3 scans `<first-pushed-commit>^..<head>`. That
      # revision does not exist when the push includes the root commit, so
      # the initial import failed before any scan. Scan the full history.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar --gzip --extract --directory /usr/local/bin gitleaks
      - name: Scan full git history
        run: gitleaks git --redact --exit-code 1 --verbose .

  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Download actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          bash <(curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") \
            "${ACTIONLINT_VERSION}"
      - name: Check workflow files
        run: ./actionlint -color

  # Build and test, Android lint, and Kotlin style stay green until a Gradle
  # project exists so they can be required checks. CodeQL does not: with no
  # settings.gradle or settings.gradle.kts there is no SARIF and that job fails.
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Detect Gradle project
        id: gradle
        run: |
          if [[ -f settings.gradle || -f settings.gradle.kts ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Gradle project is present. Build and test succeeds so it can be required before the app exists."
          fi
      - name: Set up Temurin 17
        if: steps.gradle.outputs.present == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        if: steps.gradle.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Validate Gradle wrapper
        if: steps.gradle.outputs.present == 'true'
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Assemble debug and run unit tests
        if: steps.gradle.outputs.present == 'true'
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon

  android-lint:
    name: Android lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Detect Gradle project
        id: gradle
        run: |
          if [[ -f settings.gradle || -f settings.gradle.kts ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Gradle project is present. Android lint succeeds so it can be required before the app exists."
          fi
      - name: Set up Temurin 17
        if: steps.gradle.outputs.present == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        if: steps.gradle.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Run lintDebug
        if: steps.gradle.outputs.present == 'true'
        run: ./gradlew lintDebug --no-daemon

  kotlin-style:
    name: Kotlin style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Detect Gradle project
        id: gradle
        run: |
          if [[ -f settings.gradle || -f settings.gradle.kts ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Gradle project is present. Kotlin style succeeds so it can be required before the app exists."
          fi
      - name: Set up Temurin 17
        if: steps.gradle.outputs.present == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        if: steps.gradle.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Run ktlint or detekt
        if: steps.gradle.outputs.present == 'true'
        run: |
          tasks="$(./gradlew tasks --all --no-daemon)"
          if printf '%s\n' "$tasks" | grep -q '^ktlintCheck'; then
            ./gradlew ktlintCheck --no-daemon
          elif printf '%s\n' "$tasks" | grep -q '^detekt'; then
            ./gradlew detekt --no-daemon
          else
            echo "Gradle project has no ktlintCheck or detekt task."
            exit 1
          fi

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Require a Gradle project
        run: bash scripts/ci/require_gradle_project.sh .
      - name: Set up Temurin 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Assemble debug for CodeQL
        run: ./gradlew assembleDebug --no-daemon
      - name: Analyze
        uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          output: ${{ github.workspace }}/codeql-results
          upload: always
      - name: Fail a high security result
        run: python3 scripts/ci/codeql_gate.py "${{ github.workspace }}/codeql-results"

  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Temurin 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Scan the resolved Gradle graph
        run: bash scripts/ci/dependency_scan.sh

  workflow-security:
    name: Workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Check permissions, pull-request input, and pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/workflow_security.py .
