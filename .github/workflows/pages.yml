name: Pages

on:
  push:
    branches: [master]
    paths:
      - "docs/mockups/**"
      - ".github/workflows/pages.yml"
      - "scripts/assemble-pages-site.sh"
  workflow_dispatch:
    inputs:
      wip_sha:
        description: "Optional 40-character gh-pages commit to publish under /wip/. Empty uses the branch tip."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy mockups
    runs-on: ubuntu-latest
    # A job permissions block replaces the workflow set, so contents: read
    # is repeated for checkout. pages: write and id-token: write are the
    # deploy grant. No secret and no personal access token.
    permissions:
      contents: read # checkout
      pages: write # publish the Pages site
      id-token: write # OIDC token for the Pages deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout stable mockups
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          path: stable

      # A push to gh-pages does not run this file. The workflow on that
      # branch dispatches this one and passes the pushed commit as wip_sha.
      - name: Choose work-in-progress ref
        id: wip
        env:
          EVENT_NAME: ${{ github.event_name }}
          WIP_SHA: ${{ github.event.inputs.wip_sha }}
        run: |
          set -euo pipefail
          ref=gh-pages
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$WIP_SHA" ]]; then
            if [[ ! "$WIP_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "wip_sha must be a 40-character hexadecimal commit id" >&2
              exit 1
            fi
            ref="$WIP_SHA"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout work in progress
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.wip.outputs.ref }}
          persist-credentials: false
          path: gh-pages
          fetch-depth: 1

      - name: Assemble site
        run: stable/scripts/assemble-pages-site.sh stable/docs/mockups gh-pages site

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          # .nojekyll is hidden. The default upload skips dotfiles.
          include-hidden-files: "true"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
