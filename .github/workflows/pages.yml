name: Pages

on:
  push:
    branches: [master]
    paths:
      - "docs/mockups/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy mockups
    runs-on: ubuntu-latest
    # A job permissions block replaces the workflow set, so contents: read
    # is repeated for checkout. pages: write and id-token: write are the
    # deploy grant. No secret and no personal access token.
    permissions:
      contents: read # checkout
      pages: write # publish the Pages site
      id-token: write # OIDC token for the Pages deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload mockups
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/mockups
          # .nojekyll is hidden. The default upload skips dotfiles.
          include-hidden-files: "true"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
